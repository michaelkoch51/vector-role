---
- name: Create vector group
  ansible.builtin.group:
    name: "{{ vector_group }}"
    state: present

- name: Create vector user
  ansible.builtin.user:
    name: "{{ vector_user }}"
    group: "{{ vector_group }}"
    shell: /usr/sbin/nologin
    create_home: false
    system: true

- name: Create vector directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"
  loop:
    - "{{ vector_data_dir }}"
    - "{{ vector_config_dir }}"

- name: Copy vector archive from control node
  ansible.builtin.copy:
    src: "{{ vector_archive_src }}"
    dest: "/tmp/{{ vector_archive_name }}"
    mode: "0644"

- name: Ensure extract dir exists
  ansible.builtin.file:
    path: "{{ vector_extract_dir }}"
    state: directory
    mode: "0755"

- name: Unarchive vector
  ansible.builtin.unarchive:
    src: "/tmp/{{ vector_archive_name }}"
    dest: "{{ vector_extract_dir }}"
    remote_src: true

- name: Install vector binary
  ansible.builtin.copy:
    src: "{{ vector_extract_dir }}/vector-x86_64-unknown-linux-gnu/bin/vector"
    dest: "{{ vector_bin }}"
    mode: "0755"
    remote_src: true

- name: Deploy vector config
  ansible.builtin.template:
    src: vector.toml.j2
    dest: "{{ vector_config_dir }}/vector.toml"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0644"

- name: Deploy vector systemd unit
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    mode: "0644"
  tags:
    - molecule-notest

- name: Enable and start vector
  ansible.builtin.systemd:
    name: vector
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - molecule-notest
