---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install python3 on Debian-based
      ansible.builtin.raw: |
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y python3 python3-apt
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3
        fi
      changed_when: false
