---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check vector binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/vector
      register: vector_bin

    - name: Assert vector binary is present and executable
      ansible.builtin.assert:
        that:
          - vector_bin.stat.exists
          - vector_bin.stat.executable
        fail_msg: "vector binary missing or not executable"

    - name: Check vector config exists
      ansible.builtin.stat:
        path: /etc/vector/vector.toml
      register: vector_cfg

    - name: Assert vector config is present
      ansible.builtin.assert:
        that:
          - vector_cfg.stat.exists
        fail_msg: "vector config missing"

    - name: Read vector config content
      ansible.builtin.slurp:
        src: /etc/vector/vector.toml
      register: vector_cfg_content

    - name: Assert vector config contains required sections
      ansible.builtin.assert:
        that:
          - "'[sources.in]' in (vector_cfg_content.content | b64decode)"
          - "'[sinks.out]' in (vector_cfg_content.content | b64decode)"
        fail_msg: "vector config does not contain required sections"
